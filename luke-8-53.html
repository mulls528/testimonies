<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luke 8:53 - God's Humor</title>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Public Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #e8e8e8;
            color: #333;
            min-height: 100vh;
        }

        /* Fixed Header */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 40px 15px 40px;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-btn {
            font-family: 'Public Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-btn:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .content {
            padding: 100px 200px 80px 140px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top two-column: left=title+passage, right=body text */
        .top-section {
            display: flex;
            gap: 60px;
            align-items: flex-start;
        }

        .top-left {
            flex: 2;
        }

        .top-right {
            flex: 1;
            position: relative;
            height: 0;
            overflow: visible;
        }

        .scripture-title {
            text-align: left;
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .passage-text {
            font-size: 3rem;
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 40px;
        }

        .passage-text a {
            color: #333;
            text-decoration: underline;
        }

        .passage-text a:hover {
            opacity: 0.5;
        }

        .passage-text .verse-num {
            font-weight: 200;
        }

        .body-text {
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1.3;
        }

        /* Dark image section */
        .dark-section {
            background: #1a1a1a;
            color: #e8e8e8;
            padding: 80px 200px 80px 140px;
            position: relative;
            overflow: visible;
            z-index: 1001;
        }

        /* Single flex row: image + right text, header top-aligned, body bottom-aligned */
        .dark-row {
            display: flex;
            gap: 60px;
            align-items: stretch;
        }

        .dark-img-wrap {
            flex: 1;
            position: relative;
        }

        .dark-img-wrap img {
            width: 100%;
            height: auto;
            display: block;
            will-change: transform;
            position: relative;
            z-index: 2;
            transition: transform 0.1s linear;
        }

        .image-caption {
            font-size: 0.75rem;
            font-weight: 400;
            color: #999;
            line-height: 1.4;
            margin-top: 16px;
        }

        .dark-right {
            flex: 1.5;
            color: #e8e8e8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dark-header {
            font-size: 3rem;
            font-weight: 500;
            line-height: 1.1;
            color: #e8e8e8;
        }

        .dark-body {
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1.3;
            color: #e8e8e8;
        }

        /* Underlined words are clickable */
        .passage-text u {
            cursor: pointer;
        }

        /* Footnote panel in right column */
        .footnote-panel {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
        }

        .footnote-item {
            margin-bottom: 24px;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .footnote-item.dimmed {
            opacity: 0.3;
        }

        .footnote-anchor {
            display: block;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.1;
            text-decoration: underline;
            margin-bottom: 4px;
            color: #333;
        }

        .footnote-text {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.2;
            color: #333;
        }
        .footnote-text::first-letter {
            text-transform: uppercase;
        }

        /* Side Navigation (Previous/Next) */
        .scripture-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .nav-prev, .nav-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            font-family: 'Public Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            text-transform: uppercase;
            pointer-events: auto;
            padding: 10px;
        }

        .nav-prev {
            left: 10px;
            text-orientation: mixed;
            transform: translateY(-50%) rotate(180deg);
        }

        .nav-next {
            right: 10px;
            text-orientation: mixed;
        }

        .nav-prev:hover, .nav-next:hover {
            text-decoration: underline;
            opacity: 0.5;
        }

        /* Scroll Fade */
        .top-left,
        .top-right,
        .dark-section {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Fixed Header -->
    <header class="page-header">
        <a href="index.html#textPage" class="nav-btn">Text</a>
        <a href="index.html#testimoniesPage" class="nav-btn">Testimony</a>
    </header>

    <!-- Main Content -->
    <main class="content">
        <div class="top-section">
            <div class="top-left">
                <!-- Scripture Title -->
                <h1 class="scripture-title">Luke 8:53</h1>
                <!-- Passage Text (large) -->
                <div class="passage-text">
                    And they <u data-footnote="or 'ridiculed': &quot;I should like to say also to those who are tempted to see only the ridiculous side of things, that perhaps in the whole gamut of the character there is nothing quite so dangerous as that… When we take to ridiculing all that is best and worthiest in others, by that very habit we destroy the power of believing in what is worthiest in ourselves.&quot; (Morrison)">laughed</u> at him, knowing that she was dead.
                </div>
            </div>
            <div class="top-right">
                <div class="footnote-panel"></div>
            </div>
        </div>
    </main>

    <!-- Previous/Next Navigation -->
    <nav class="scripture-nav">
        <a href="luke-6-25.html" class="nav-prev">Luke 6:25</a>
        <a href="james-4-9.html" class="nav-next">James 4:9</a>
    </nav>

    <script>
        // --- Scroll Fade (top blocks) ---
        function updateFadeOnScroll() {
            const blocks = document.querySelectorAll(
                '.top-left, .top-right, .dark-section'
            );
            blocks.forEach(block => {
                const top = block.getBoundingClientRect().top;
                const height = block.getBoundingClientRect().height;
                if (top >= 0) {
                    block.style.opacity = '1';
                } else if (top < 0 && top > -height) {
                    const ratio = 1 + (top / height);
                    block.style.opacity = Math.max(0, Math.pow(ratio, 0.3));
                } else {
                    block.style.opacity = '0';
                }
            });
        }

        // --- Image float: extra lift as dark section enters, settles into straddled position ---
        function updateImageFloat() {
            const darkSection = document.querySelector('.dark-section');
            const img = darkSection ? darkSection.querySelector('.dark-img-wrap img') : null;
            if (!darkSection || !img) return;

            const vh = window.innerHeight;
            const sectionTop = darkSection.getBoundingClientRect().top;

            // Image sits above dark section via CSS margin-top: -120px.
            // JS adds an extra translateY nudge: -40px before entry, easing to 0 as it scrolls in.
            const maxFloat = -120;
            const enterPoint = vh;        // animation starts when section enters viewport
            const settlePoint = vh * 0.5; // fully settled when section top is at 50% viewport height

            if (sectionTop >= enterPoint) {
                img.style.transform = 'translateY(-120px)';
            } else if (sectionTop <= settlePoint) {
                img.style.transform = 'translateY(0px)';
            } else {
                const range = enterPoint - settlePoint;
                const progress = (enterPoint - sectionTop) / range; // 0→1
                const floatAmount = maxFloat * (1 - progress);
                img.style.transform = `translateY(${floatAmount}px)`;
            }
        }

        function onScroll() {
            updateFadeOnScroll();
            updateImageFloat();
            updateDarkFixed();
        }

        // --- Position dark section so it peeks ~15% from bottom on load ---
        function initDarkSectionOffset() {
            const darkSection = document.querySelector('.dark-section');
            if (!darkSection) return;
            darkSection.style.marginTop = '';
            const offsetTop = darkSection.offsetTop;
            const vh = window.innerHeight;
            // Target: top of dark section at 97vh (3% visible at bottom of screen)
            if (offsetTop < vh * 0.97) {
                darkSection.style.marginTop = (vh * 0.97 - offsetTop) + 'px';
            }
        }

        let darkPlaceholderTop = 0;

        function initDarkFixed() {
            const dark = document.querySelector('.dark-section');
            if (!dark) return;
            const existing = document.getElementById('dark-placeholder');
            if (existing) existing.remove();
            dark.style.position = '';
            dark.style.height = '';
            dark.style.transform = '';
            dark.style.boxShadow = '';
            const contentEl = document.querySelector('.content');
            if (contentEl) contentEl.style.filter = '';

            const vh = window.innerHeight;
            const peekHeight = Math.round(vh * 0.03);
            const placeholder = document.createElement('div');
            placeholder.id = 'dark-placeholder';
            placeholder.style.height = vh + 'px';
            placeholder.style.marginTop = dark.style.marginTop || '0px';
            dark.style.marginTop = '0';
            dark.before(placeholder);
            darkPlaceholderTop = placeholder.offsetTop;
            dark.style.position = 'fixed';
            dark.style.bottom = '0';
            dark.style.left = '0';
            dark.style.width = '100%';
            dark.style.height = vh + 'px';
            dark.style.transform = 'translateY(' + (vh - peekHeight) + 'px)';
        }

        function updateDarkFixed() {
            const dark = document.querySelector('.dark-section');
            if (!dark || !darkPlaceholderTop) return;
            const vh = window.innerHeight;
            const peekHeight = Math.round(vh * 0.03);
            const progress = Math.max(0, Math.min(1, window.scrollY / (darkPlaceholderTop * 0.6)));
            dark.style.transform = 'translateY(' + ((vh - peekHeight) * (1 - progress)) + 'px)';
            // Float: shadow above the panel grows with progress
            const sBlur = Math.round(50 * progress);
            const sOpacity = (0.45 * progress).toFixed(2);
            dark.style.boxShadow = '0 -' + Math.round(20 * progress) + 'px ' + sBlur + 'px rgba(0,0,0,' + sOpacity + ')';
            // Blur the content so it reads as blurred beneath the glass
            const content = document.querySelector('.content');
            if (content) content.style.filter = 'blur(' + (12 * Math.sqrt(progress)).toFixed(1) + 'px)';
        }

        window.addEventListener('scroll', onScroll);
        window.addEventListener('resize', function() {
            initDarkSectionOffset();
            initDarkFixed();
            onScroll();
        });
        initDarkSectionOffset();
        initDarkFixed();
        onScroll();

        // --- Footnote system ---
        (function() {
            const panel = document.querySelector('.footnote-panel');
            if (!panel) return;

            document.querySelectorAll('.passage-text u').forEach(function(el) {
                el.addEventListener('click', function() {
                    // Prevent duplicate footnotes for the same word/phrase
                    const word = el.textContent.trim();
                    const existing = panel.querySelectorAll('.footnote-anchor');
                    for (let i = 0; i < existing.length; i++) {
                        if (existing[i].textContent.trim() === word) return;
                    }

                    // Dim all existing footnotes
                    panel.querySelectorAll('.footnote-item').forEach(function(fn) {
                        fn.classList.add('dimmed');
                    });

                    // Create and append new footnote
                    const item = document.createElement('div');
                    item.className = 'footnote-item';
                    item.innerHTML =
                        '<span class="footnote-anchor">' + word + '</span>' +
                        '<p class="footnote-text">' + (el.getAttribute('data-footnote') || '') + '</p>';
                    panel.appendChild(item);
                });
            });
        })();
    </script>
</body>
</html>
